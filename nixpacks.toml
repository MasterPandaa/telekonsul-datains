# Override build to prevent migration during build phase
# Migration will only run at start time when DB is available

[phases.build]
cmds = ["npm run build", "php artisan storage:link"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
